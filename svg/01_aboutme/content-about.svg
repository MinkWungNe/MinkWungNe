<svg width="100%" height="175" viewBox="0 0 900 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      .glow-spine {
        animation: cyber-purple-aurora 3s ease-in-out infinite;
      }
      .circuit-line {
        stroke: #ffffff;
        stroke-width: 1.2;
        stroke-dasharray: 5 4;
        animation: cyber-stream-down 16s linear infinite;
      }
      .node-circle {
        fill: #ffffff;
      }
      .line-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", monospace, sans-serif;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.12em;
        fill: #c084fc;
      }
      .line-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 13px;
        fill: #c0caf5;
      }
      .line-highlight {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #f1f5f9;
      }
      .line-quote {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 12.5px;
        font-style: italic;
        fill: #e9d5ff;
      }

      @keyframes cyber-purple-aurora {
        0%, 100% {
          filter: drop-shadow(0 0 1px #805cf6) 
                  drop-shadow(0 0 3px rgba(150, 38, 255, 0.7));
        }
        50% {
          filter: drop-shadow(0 0 1.5px #ffffff) 
                  drop-shadow(0 0 4px #6c29e7) 
                  drop-shadow(0 0 5.5px rgba(125, 92, 246, 0.95));
        }
      }

      @keyframes cyber-stream-down {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -210;
        }
      }
    ]]></style>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Glowing Left Circuit Spine -->
    <g class="glow-spine">
      <line x1="12" y1="12" x2="12" y2="148" class="circuit-line" />
      <circle cx="12" cy="12" r="4" class="node-circle" />
      <circle cx="12" cy="46" r="4" class="node-circle" />
      <circle cx="12" cy="80" r="4" class="node-circle" />
      <circle cx="12" cy="114" r="4" class="node-circle" />
      <circle cx="12" cy="148" r="4" class="node-circle" />
    </g>

    <!-- Line 1: Education -->
    <g transform="translate(0, 4)">
      <text x="32" y="12" class="line-label"> EDUCATION // </text>
      <text x="165" y="12" class="line-text">Computer Science Student at <tspan class="line-highlight">Đại học Hùng Vương TP.HCM (DHV)</tspan> (Major: Software Engineering)</text>
    </g>

    <!-- Line 2: Interests -->
    <g transform="translate(0, 38)">
      <text x="32" y="12" class="line-label"> INTERESTS // </text>
      <text x="165" y="12" class="line-text">Algorithmic Problem Solving, Distributed Systems, Software Architecture &amp; Game Dev</text>
    </g>

    <!-- Line 3: Objective -->
    <g transform="translate(0, 72)">
      <text x="32" y="12" class="line-label"> OBJECTIVE // </text>
      <text x="165" y="12" class="line-text">Seeking <tspan class="line-highlight">Software Engineer / Intern</tspan> opportunities to build scalable, high-impact systems</text>
    </g>

    <!-- Line 4: Continuous Growth -->
    <g transform="translate(0, 106)">
      <text x="32" y="12" class="line-label"> FOUNDATION // </text>
      <text x="165" y="12" class="line-text">Cultivating strong core fundamentals in <tspan class="line-highlight">DSA</tspan>, Clean Architecture, and AI-augmented workflows</text>
    </g>

    <!-- Line 5: Philosophy -->
    <g transform="translate(0, 140)">
      <text x="32" y="12" class="line-label"> PHILOSOPHY // </text>
      <text x="165" y="12" class="line-quote">“Write code that is easy to reason about, maintain, and scale.”</text>
    </g>
  </g>
</svg>
