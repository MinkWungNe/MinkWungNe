<svg width="100%" height="320" viewBox="0 0 420 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      .glow-spine {
        animation: cyber-purple-aurora 3s ease-in-out infinite;
      }
      .circuit-line {
        stroke: #ffffff;
        stroke-width: 1.2;
        stroke-dasharray: 5 4;
        animation: cyber-stream-down 16s linear infinite;
      }
      .node-circle {
        fill: #ffffff;
      }
      .line-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", monospace, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        fill: #c084fc;
      }
      .line-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 12.5px;
        fill: #c0caf5;
      }
      .line-highlight {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        fill: #f1f5f9;
      }
      .line-quote {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 12px;
        font-style: italic;
        fill: #e9d5ff;
      }

      @keyframes cyber-purple-aurora {
        0%, 100% {
          filter: drop-shadow(0 0 1px #805cf6) 
                  drop-shadow(0 0 3px rgba(150, 38, 255, 0.7));
        }
        50% {
          filter: drop-shadow(0 0 1.5px #ffffff) 
                  drop-shadow(0 0 4px #6c29e7) 
                  drop-shadow(0 0 5.5px rgba(125, 92, 246, 0.95));
        }
      }

      @keyframes cyber-stream-down {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -210;
        }
      }
    ]]></style>
  </defs>

  <g transform="translate(15, 12)">
    <!-- Glowing Left Circuit Spine -->
    <g class="glow-spine">
      <line x1="10" y1="14" x2="10" y2="280" class="circuit-line" />
      <circle cx="10" cy="14" r="4" class="node-circle" />
      <circle cx="10" cy="78" r="4" class="node-circle" />
      <circle cx="10" cy="142" r="4" class="node-circle" />
      <circle cx="10" cy="206" r="4" class="node-circle" />
      <circle cx="10" cy="270" r="4" class="node-circle" />
    </g>

    <!-- Item 1: Education -->
    <g transform="translate(28, 4)">
      <text x="0" y="10" class="line-label">🎓 EDUCATION // DHV UNIVERSITY</text>
      <text x="0" y="27" class="line-text">CS Student at <tspan class="line-highlight">ĐH Hùng Vương TP.HCM (DHV)</tspan></text>
      <text x="0" y="44" class="line-text">(Major: Software Engineering)</text>
    </g>

    <!-- Item 2: Interests -->
    <g transform="translate(28, 68)">
      <text x="0" y="10" class="line-label">💡 INTERESTS // ARCHITECTURE &amp; SYSTEMS</text>
      <text x="0" y="27" class="line-text">Algorithmic Problem Solving &amp; DSA</text>
      <text x="0" y="44" class="line-text">Distributed Systems, Architecture &amp; Game Dev</text>
    </g>

    <!-- Item 3: Objective -->
    <g transform="translate(28, 132)">
      <text x="0" y="10" class="line-label">🚀 OBJECTIVE // ENGINEERING ROLES</text>
      <text x="0" y="27" class="line-text">Seeking <tspan class="line-highlight">Software Engineer / Intern</tspan> roles</text>
      <text x="0" y="44" class="line-text">Building scalable, high-impact systems</text>
    </g>

    <!-- Item 4: Foundation -->
    <g transform="translate(28, 196)">
      <text x="0" y="10" class="line-label">🧠 FOUNDATION // CORE SKILLS</text>
      <text x="0" y="27" class="line-text">Core fundamentals in <tspan class="line-highlight">DSA</tspan> &amp; Clean Architecture</text>
      <text x="0" y="44" class="line-text">Modern AI-augmented engineering workflows</text>
    </g>

    <!-- Item 5: Philosophy -->
    <g transform="translate(28, 260)">
      <text x="0" y="10" class="line-label">⚡ PHILOSOPHY // DEV MANTRA</text>
      <text x="0" y="28" class="line-quote">“Write code that is easy to reason about &amp; scale.”</text>
    </g>
  </g>
</svg>
