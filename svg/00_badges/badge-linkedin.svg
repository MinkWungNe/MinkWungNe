<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 42" width="190" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a66c2" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#120c23" stop-opacity="0.85" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad-linkedin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a66c2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0a66c2" stop-opacity="0.4" />
    </linearGradient>

    <!-- Shine Sweep Gradient -->
    <linearGradient id="shine-grad-linkedin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Clip Path for rounded corners -->
    <clipPath id="badge-clip-linkedin">
      <rect x="1" y="1" width="188" height="40" rx="6" />
    </clipPath>
  </defs>

  <style>
    .badge-bg {
      fill: url(#bg-grad-linkedin);
      rx: 6px;
    }
    .badge-border {
      fill: none;
      stroke: url(#border-grad-linkedin);
      stroke-width: 1.2;
      rx: 6px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", monospace, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      fill: #ffffff;
      text-anchor: start;
      dominant-baseline: central;
    }
    .badge-dot {
      fill: #0a66c2;
      filter: drop-shadow(0 0 3px #0a66c2);
    }
    .shine-sweep {
      animation: shine-scroll 4.5s cubic-bezier(0.25, 1, 0.4, 1) infinite;
      pointer-events: none;
    }
    @keyframes shine-scroll {
      0% {
        transform: translateX(-100px) skewX(-25deg);
        opacity: 0;
      }
      15% {
        opacity: 0.75;
      }
      30% {
        transform: translateX(250px) skewX(-25deg);
        opacity: 0;
      }
      100% {
        transform: translateX(250px) skewX(-25deg);
        opacity: 0;
      }
    }
  </style>

  <!-- Background and Border -->
  <rect x="1" y="1" width="188" height="40" class="badge-bg" />
  <rect x="1" y="1" width="188" height="40" class="badge-border" />

  <!-- Left Indicator Accent Dot -->
  <circle cx="16" cy="21" r="3" class="badge-dot" />

  <!-- Label (Left side) -->
  <text x="27" y="21" class="badge-label">LINKEDIN</text>

  <!-- Icon (Right side: LinkedIn "in" symbol) -->
  <g transform="translate(152, 12)">
    <rect width="18" height="18" rx="3.5" fill="#0a66c2" />
    <path d="M4.5 7.2 h2.1 v6.3 H4.5 V7.2 z M5.55 4.6 a1.2 1.2 0 1 1 0 2.4 a1.2 1.2 0 0 1 0-2.4 z M8.2 7.2 h2 v0.9 h.03 c.28-.54 1-.95 1.95-.95 2.1 0 2.5 1.4 2.5 3.2 v3.15 h-2.1 v-3.1 c0-.75 0-1.7-1.05-1.7s-1.2 .8-1.2 1.6 v3.2 H8.2 V7.2 z" fill="#ffffff" />
  </g>

  <!-- Shine Light Effect Overlay -->
  <g clip-path="url(#badge-clip-linkedin)">
    <rect x="0" y="-10" width="35" height="60" fill="url(#shine-grad-linkedin)" class="shine-sweep" />
  </g>
</svg>
