<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 42" width="190" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-resume" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b026ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#120c23" stop-opacity="0.85" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad-resume" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b026ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#805cf6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Shine Sweep Gradient -->
    <linearGradient id="shine-grad-resume" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Clip Path for rounded corners -->
    <clipPath id="badge-clip-resume">
      <rect x="1" y="1" width="188" height="40" rx="6" />
    </clipPath>
  </defs>

  <style>
    .badge-bg {
      fill: url(#bg-grad-resume);
      rx: 6px;
    }
    .badge-border {
      fill: none;
      stroke: url(#border-grad-resume);
      stroke-width: 1.2;
      rx: 6px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", monospace, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      fill: #ffffff;
      text-anchor: start;
      dominant-baseline: central;
    }
    .badge-dot {
      fill: #b026ff;
      filter: drop-shadow(0 0 3px #b026ff);
    }
    .shine-sweep {
      animation: shine-scroll 4.5s cubic-bezier(0.25, 1, 0.4, 1) infinite;
      pointer-events: none;
    }
    @keyframes shine-scroll {
      0% {
        transform: translateX(-100px) skewX(-25deg);
        opacity: 0;
      }
      15% {
        opacity: 0.75;
      }
      30% {
        transform: translateX(250px) skewX(-25deg);
        opacity: 0;
      }
      100% {
        transform: translateX(250px) skewX(-25deg);
        opacity: 0;
      }
    }
  </style>

  <!-- Background and Border -->
  <rect x="1" y="1" width="188" height="40" class="badge-bg" />
  <rect x="1" y="1" width="188" height="40" class="badge-border" />

  <!-- Left Indicator Accent Dot -->
  <circle cx="16" cy="21" r="3" class="badge-dot" />

  <!-- Label (Left side) -->
  <text x="27" y="21" class="badge-label">RESUME / CV</text>

  <!-- Icon (Right side: Document with lines) -->
  <g transform="translate(150, 11)">
    <path d="M2.5 1.5 a1.5 1.5 0 0 1 1.5-1.5 h6.5 l5.5 5.5 v11 a1.5 1.5 0 0 1-1.5 1.5 h-10.5 a1.5 1.5 0 0 1-1.5-1.5 v-15 z" fill="rgba(176, 38, 255, 0.25)" stroke="#b026ff" stroke-width="1.3" />
    <path d="M10.5 0 v5.5 h5.5" fill="none" stroke="#b026ff" stroke-width="1.3" />
    <line x1="5.5" y1="8" x2="9.5" y2="8" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />
    <line x1="5.5" y1="11" x2="12.5" y2="11" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />
    <line x1="5.5" y1="14" x2="11" y2="14" stroke="#d28cff" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Shine Light Effect Overlay -->
  <g clip-path="url(#badge-clip-resume)">
    <rect x="0" y="-10" width="35" height="60" fill="url(#shine-grad-resume)" class="shine-sweep" />
  </g>
</svg>
