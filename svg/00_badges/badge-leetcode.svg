<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 42" width="190" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-leetcode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa116" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#120c23" stop-opacity="0.85" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad-leetcode" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffa116" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffa116" stop-opacity="0.4" />
    </linearGradient>

    <!-- Shine Sweep Gradient -->
    <linearGradient id="shine-grad-leetcode" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Clip Path for rounded corners -->
    <clipPath id="badge-clip-leetcode">
      <rect x="1" y="1" width="188" height="40" rx="6" />
    </clipPath>
  </defs>

  <style>
    .badge-bg {
      fill: url(#bg-grad-leetcode);
      rx: 6px;
    }
    .badge-border {
      fill: none;
      stroke: url(#border-grad-leetcode);
      stroke-width: 1.2;
      rx: 6px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", monospace, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      fill: #ffffff;
      text-anchor: start;
      dominant-baseline: central;
    }
    .badge-dot {
      fill: #ffa116;
      filter: drop-shadow(0 0 3px #ffa116);
    }
    .shine-sweep {
      animation: shine-scroll 4.5s cubic-bezier(0.25, 1, 0.4, 1) infinite;
      pointer-events: none;
    }
    @keyframes shine-scroll {
      0% {
        transform: translateX(-100px) skewX(-25deg);
        opacity: 0;
      }
      15% {
        opacity: 0.75;
      }
      30% {
        transform: translateX(250px) skewX(-25deg);
        opacity: 0;
      }
      100% {
        transform: translateX(250px) skewX(-25deg);
        opacity: 0;
      }
    }
  </style>

  <!-- Background and Border -->
  <rect x="1" y="1" width="188" height="40" class="badge-bg" />
  <rect x="1" y="1" width="188" height="40" class="badge-border" />

  <!-- Left Indicator Accent Dot -->
  <circle cx="16" cy="21" r="3" class="badge-dot" />

  <!-- Label (Left side) -->
  <text x="27" y="21" class="badge-label">LEETCODE</text>

  <!-- Icon (Right side: LeetCode Emblem) -->
  <g transform="translate(150, 11)">
    <path d="M12.5 3.8 a1.2 1.2 0 0 0-1.7 0 L6 8.9 a3.2 3.2 0 0 0 0 4.6 l4.2 4.2 a3.2 3.2 0 0 0 4.6 0 l2.3-2.3 a1.2 1.2 0 0 0-1.7-1.7 l-2.3 2.3 a1 1 0 0 1-1.3 0 l-4.2-4.2 a1 1 0 0 1 0-1.3 l4.9-4.9 a1.2 1.2 0 0 0 0-1.8 z" fill="#ffa116" />
    <path d="M7.8 11.2 h7.5 a1 1 0 0 0 0-2 h-7.5 a1 1 0 0 0 0 2 z" fill="#ffffff" />
  </g>

  <!-- Shine Light Effect Overlay -->
  <g clip-path="url(#badge-clip-leetcode)">
    <rect x="0" y="-10" width="35" height="60" fill="url(#shine-grad-leetcode)" class="shine-sweep" />
  </g>
</svg>
