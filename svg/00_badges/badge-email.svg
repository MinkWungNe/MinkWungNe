<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 42" width="190" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-email" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea4335" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#120c23" stop-opacity="0.85" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad-email" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea4335" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ea4335" stop-opacity="0.4" />
    </linearGradient>

    <!-- Shine Sweep Gradient -->
    <linearGradient id="shine-grad-email" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Clip Path for rounded corners -->
    <clipPath id="badge-clip-email">
      <rect x="1" y="1" width="188" height="40" rx="6" />
    </clipPath>
  </defs>

  <style>
    .badge-bg {
      fill: url(#bg-grad-email);
      rx: 6px;
    }
    .badge-border {
      fill: none;
      stroke: url(#border-grad-email);
      stroke-width: 1.2;
      rx: 6px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", monospace, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      fill: #ffffff;
      text-anchor: start;
      dominant-baseline: central;
    }
    .badge-dot {
      fill: #ea4335;
      filter: drop-shadow(0 0 3px #ea4335);
    }
    .shine-sweep {
      animation: shine-scroll 4.5s cubic-bezier(0.25, 1, 0.4, 1) infinite;
      pointer-events: none;
    }
    @keyframes shine-scroll {
      0% {
        transform: translateX(-100px) skewX(-25deg);
        opacity: 0;
      }
      15% {
        opacity: 0.75;
      }
      30% {
        transform: translateX(250px) skewX(-25deg);
        opacity: 0;
      }
      100% {
        transform: translateX(250px) skewX(-25deg);
        opacity: 0;
      }
    }
  </style>

  <!-- Background and Border -->
  <rect x="1" y="1" width="188" height="40" class="badge-bg" />
  <rect x="1" y="1" width="188" height="40" class="badge-border" />

  <!-- Left Indicator Accent Dot -->
  <circle cx="16" cy="21" r="3" class="badge-dot" />

  <!-- Label (Left side) -->
  <text x="27" y="21" class="badge-label">EMAIL</text>

  <!-- Icon (Right side: Gmail Envelope) -->
  <g transform="translate(150, 12)">
    <!-- Envelope Base -->
    <rect x="0" y="2" width="20" height="14" rx="2" fill="rgba(234, 67, 53, 0.2)" stroke="#ea4335" stroke-width="1.3" />
    <!-- Envelope Flap -->
    <path d="M1 3.5 L10 10.5 L19 3.5" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Shine Light Effect Overlay -->
  <g clip-path="url(#badge-clip-email)">
    <rect x="0" y="-10" width="35" height="60" fill="url(#shine-grad-email)" class="shine-sweep" />
  </g>
</svg>
