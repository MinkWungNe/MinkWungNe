<svg width="100%" height="32" viewBox="0 0 800 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bộ lọc tạo vệt phát sáng Neon -->
    <filter id="neon-glow-top" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Lớp viền góc Cyberpunk phát sáng -->
  <g filter="url(#neon-glow-top)">
    <!-- Góc trên - Trái -->
    <path d="M 6 32 L 6 12 L 18 6 L 80 6" stroke="#b026ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="85" cy="6" r="2.5" fill="#f000ff"/>

    <!-- Nét đứt trang trí công nghệ ở giữa -->
    <line x1="110" y1="6" x2="690" y2="6" stroke="#b026ff" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

    <!-- Góc trên - Phải -->
    <circle cx="715" cy="6" r="2.5" fill="#f000ff"/>
    <path d="M 720 6 L 782 6 L 794 12 L 794 32" stroke="#b026ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lõi neon sáng trắng giúp hiệu ứng phát sáng chân thực hơn -->
  <path d="M 6 32 L 6 12 L 18 6 L 80 6" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 720 6 L 782 6 L 794 12 L 794 32" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
